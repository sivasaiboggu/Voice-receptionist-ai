# Local demo stack. Production hosting is Vercel (dashboard) + a host with
# a persistent disk for the API (Render/Railway/Fly) — see README.
#
# Postgres (optional): the `db` service below runs Postgres 16. To use it,
# set POSTGRES_PASSWORD in .env and point the API at it, e.g.
#   DATABASE_URL=postgresql://receptionist:${POSTGRES_PASSWORD}@db:5432/receptionist
# Leave DATABASE_URL as sqlite:///... (the default) and the API keeps using
# ./receptionist.db — the db container then just sits idle. No credentials
# are hardcoded here: the password comes from the environment only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receptionist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-receptionist}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receptionist}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports: ["8001:8001"]
    env_file: .env
    volumes: ["./receptionist.db:/app/receptionist.db"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time. The browser calls this
        # origin directly, so for local compose it is the host's localhost.
        VITE_API_URL: http://localhost:8001
    ports: ["5174:5174"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
